<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/bootstrap/stylesheet.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <div class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="#">My Site</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="container mt-5">
      <!--container-fluid is a container with no margins-->
      <div class="row g-4">
        <div class="col-12 col-md-4">
          <div class="custom-card">
            <h3>Card One</h3>
            <p>This is a simple card with a little text content.</p>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="custom-card">
            <h3>Card Two</h3>
            <p>Another example card using Bootstrap's grid layout.</p>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="custom-card">
            <h3>Card Three</h3>
            <p>Cards are fully responsibe thanks to Bootstrap columns.</p>
          </div>
        </div>
      </div>
    </div>
    <button class="btn btn-primary">Hello</button>
  </body>
</html>
